<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>조회 콘솔 | 직원·법인카드</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Malgun Gothic", "맑은 고딕", sans-serif;
      color: #19243d;
      background: #f3f5fa;
      --muted: #5b6580;
      --line: #dfe4ee;
      --blue: #344bc6;
      --navy: #151e40;
      --white: #fff;
      --radius: 20px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .68; }
    :focus-visible { outline: 3px solid #7284f6; outline-offset: 3px; }
    [hidden] { display: none !important; }
    .shell { width: min(100% - 72px, 1240px); margin-inline: auto; }
    .topbar { background: #fff; border-bottom: 1px solid var(--line); }
    .topbar-inner { min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 11px; font-size: 1.04rem; font-weight: 750; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--navy); }
    .brand-mark::before { width: 13px; height: 13px; content: ""; border: 2px solid #d1d9ff; border-radius: 4px; transform: rotate(45deg); }
    .env, .tag, .stage-state {
      display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; border-radius: 999px;
      background: #edf0f8; color: #485475; font-size: .82rem; font-weight: 650; padding: 5px 10px;
    }
    .env { color: #28564a; background: #e9f4ee; }
    .env::before { content: ""; width: 7px; height: 7px; border-radius: 100%; background: #388b73; }
    .intro { padding: 42px 0 25px; }
    .intro h1 { margin: 0; font-size: clamp(1.9rem, 4vw, 2.9rem); letter-spacing: -.062em; line-height: 1.18; }
    .intro p { margin: 10px 0 0; color: var(--muted); font-size: 1rem; line-height: 1.5; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 345px); align-items: start; gap: 22px; padding-bottom: 40px; }
    .primary { display: grid; min-width: 0; gap: 20px; }
    .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 4px 18px #27304f06; min-width: 0; }
    .composer {
      padding: 25px; color: #fff; border: 0;
      background: radial-gradient(circle at 95% 0%, #414fb1 0, transparent 52%), var(--navy);
    }
    .composer label { display: block; margin-bottom: 12px; font-size: 1.04rem; font-weight: 720; }
    textarea {
      display: block; width: 100%; min-height: 104px; resize: vertical; padding: 15px 16px; border-radius: 12px;
      background: #fff; border: 1px solid #bac7f8; color: #19243d; line-height: 1.55;
    }
    textarea::placeholder { color: #66728c; }
    .form-actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 15px; }
    .presets { display: flex; gap: 7px; flex-wrap: wrap; }
    .preset { color: #f2f4ff; background: #ffffff12; border: 1px solid #ffffff47; border-radius: 8px; padding: 6px 10px; font-size: .87rem; }
    .preset:hover { background: #ffffff29; }
    .submit { display: inline-flex; align-items: center; justify-content: center; gap: 9px; flex: none; border: 0; border-radius: 9px; background: #dbe1ff; color: #192753; padding: 10px 18px; font-weight: 750; }
    .submit:hover:enabled { background: #edf0ff; }
    .loader { width: 14px; height: 14px; border: 2px solid #35498555; border-top-color: #263b91; border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .answer-card, .trace-card { padding: 23px 25px; }
    .card-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    h2 { font-size: 1.13rem; margin: 0; letter-spacing: -.03em; }
    .answer-question, .reference { margin: 9px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.5; overflow-wrap: anywhere; }
    .answer-content { margin-top: 17px; border-top: 1px solid var(--line); padding-top: 17px; line-height: 1.64; overflow-wrap: anywhere; }
    .answer-content > :first-child { margin-top: 0; }
    .answer-content > :last-child { margin-bottom: 0; }
    .answer-content p { margin: 0 0 12px; }
    .answer-content ul { margin: 0 0 12px; padding-left: 22px; }
    .answer-content h3 { margin: 12px 0 6px; font-size: 1rem; }
    .tag[data-tone="success"] { color: #22664f; background: #e6f5ec; }
    .tag[data-tone="warning"] { color: #805320; background: #fff2dc; }
    .tag[data-tone="error"] { color: #9a3034; background: #fae9ec; }
    .answer-content code { padding: 2px 4px; background: #edf0f8; border-radius: 4px; }
    .table-wrap { overflow-x: auto; margin-bottom: 13px; border: 1px solid var(--line); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: .91rem; text-align: left; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { background: #eef1fb; color: #3d4970; font-weight: 700; }
    tbody tr:last-child td { border-bottom: 0; }
    .stages { display: grid; gap: 0; margin: 18px 0 14px; padding: 0; list-style: none; }
    .stage { position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: start; gap: 10px; padding: 11px 0; }
    .stage:not(:last-child)::before { content: ""; position: absolute; left: 16px; width: 1px; top: 41px; bottom: -12px; background: #d5dcf2; }
    .stage-icon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--blue); background: #edf0fd; font-size: .88rem; font-weight: 800; }
    .stage-title { font-size: .94rem; font-weight: 730; line-height: 1.45; }
    .stage-note { display: block; color: var(--muted); font-size: .84rem; line-height: 1.45; overflow-wrap: anywhere; margin-top: 3px; }
    .stage-state { padding: 3px 7px; font-size: .77rem; }
    .stage[data-state="done"] .stage-state { color: #28634f; background: #e6f5ec; }
    .stage[data-state="failed"] .stage-state { color: #9a3034; background: #fae9ec; }
    .stage[data-state="pending"] .stage-state { color: #2846b0; background: #e9edff; }
    .trace-details { border-top: 1px solid var(--line); padding-top: 13px; }
    summary { cursor: pointer; color: #3446a3; font-weight: 650; font-size: .92rem; }
    .trace-query { margin-top: 15px; }
    .trace-query h3 { font-size: .88rem; margin: 0 0 7px; }
    .trace-query p { color: var(--muted); font-size: .85rem; margin: 6px 0; overflow-wrap: anywhere; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f1f3fa; color: #2a385f; border-radius: 8px; margin: 7px 0; padding: 11px; font-size: .83rem; line-height: 1.5; }
    .empty { color: var(--muted); }
    @media (max-width: 900px) {
      .shell { width: min(100% - 36px, 740px); }
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .intro { padding-top: 30px; }
    }
    @media (max-width: 500px) {
      .shell { width: calc(100% - 28px); }
      .topbar-inner { min-height: 60px; }
      .composer, .answer-card, .trace-card { padding: 18px; }
      .form-actions { align-items: stretch; flex-direction: column; }
      .submit { min-height: 43px; }
    }
    @media (prefers-reduced-motion: reduce) { .loader { animation: none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="shell topbar-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span> 조회 콘솔</div>
      <span class="env">SQLite 테스트 데이터</span>
    </div>
  </header>
  <main class="shell">
    <div class="intro">
      <h1>직원·법인카드 조회</h1>
      <p>직원 정보와 카드 사용 내역을 질문으로 확인하세요.</p>
    </div>
    <div class="workspace">
      <div class="primary">
        <form id="query-form" class="card composer">
          <label for="question">무엇을 조회할까요?</label>
          <textarea id="question" name="question" rows="3" maxlength="1000" required placeholder="예: 김가온의 2026년 11월 법인카드 사용 합계를 알려줘"></textarea>
          <div class="form-actions">
            <div class="presets" aria-label="예시 질문">
              <button class="preset" type="button" data-question="김가온의 2026년 11월 법인카드 사용 건수와 총액을 표로 알려줘.">개인 카드 합계</button>
              <button class="preset" type="button" data-question="2026년 11월 법인카드 사용액이 가장 많은 부서 3곳을 보여줘.">부서별 지출 순위</button>
              <button class="preset" type="button" data-question="E001 직원의 이름, 부서, 평가를 알려줘.">직원 정보</button>
            </div>
            <button class="submit" type="submit"><span id="loader" class="loader" aria-hidden="true" hidden></span><span id="submit-label">질문하기</span></button>
          </div>
        </form>
        <section class="card answer-card" aria-labelledby="answer-title">
          <div class="card-heading">
            <h2 id="answer-title">최종 답변</h2>
            <span class="tag" id="answer-state" role="status">대기 중</span>
          </div>
          <p class="answer-question" id="result-question" hidden></p>
          <div class="answer-content" id="answer" aria-live="polite">
            <p class="empty">질문을 입력하면 답변이 여기에 표시됩니다.</p>
          </div>
        </section>
      </div>
      <aside class="card trace-card" aria-labelledby="trace-title">
        <h2 id="trace-title">처리 과정</h2>
        <p class="reference" id="reference" hidden></p>
        <ol class="stages">
          <li class="stage" id="stage-intent">
            <span class="stage-icon" aria-hidden="true">G</span>
            <div><span class="stage-title">Gemini</span><span class="stage-note">질문 의도 분석</span></div>
            <span class="stage-state">대기</span>
          </li>
          <li class="stage" id="stage-sql">
            <span class="stage-icon" aria-hidden="true">DB</span>
            <div><span class="stage-title">SQLite</span><span class="stage-note">Gemini SQL로 조회</span></div>
            <span class="stage-state">대기</span>
          </li>
          <li class="stage" id="stage-answer">
            <span class="stage-icon" aria-hidden="true">AI</span>
            <div><span class="stage-title">OpenAI</span><span class="stage-note">조회 결과로 답변 작성</span></div>
            <span class="stage-state">대기</span>
          </li>
        </ol>
        <details class="trace-details" id="sql-details">
          <summary>실행 SQL과 결과</summary>
          <div id="sql-output"><p class="empty">표시할 조회 기록이 없습니다.</p></div>
        </details>
      </aside>
    </div>
  </main>
  <script>
    const find = (selector) => document.querySelector(selector);
    const form = find('#query-form');
    const input = find('#question');
    const submit = find('.submit');
    const answer = find('#answer');
    const badge = find('#answer-state');
    const resultQuestion = find('#result-question');
    const reference = find('#reference');
    const sqlOutput = find('#sql-output');
    const sqlDetails = find('#sql-details');
    const stageLabels = { idle: '대기', pending: '처리 중', done: '완료', failed: '오류', skipped: '생략' };
    let submitted = false;

    function element(tag, value) {
      const node = document.createElement(tag);
      if (value !== undefined) node.textContent = value;
      return node;
    }

    function inlineText(node, text) {
      for (const part of text.split(/(\*\*[^*]+\*\*|`[^`]+`)/g)) {
        if (part.startsWith('**') && part.endsWith('**') && part.length > 4) {
          node.append(element('strong', part.slice(2, -2)));
        } else if (part.startsWith('`') && part.endsWith('`') && part.length > 2) {
          node.append(element('code', part.slice(1, -1)));
        } else {
          node.append(part);
        }
      }
    }

    function tableNode(columns, rows) {
      const wrap = element('div');
      wrap.className = 'table-wrap';
      const table = element('table');
      const header = table.createTHead().insertRow();
      for (const label of columns) {
        const cell = element('th', label);
        cell.scope = 'col';
        header.append(cell);
      }
      const content = table.createTBody();
      for (const row of rows) {
        const line = content.insertRow();
        for (const value of row) {
          const cell = line.insertCell();
          inlineText(cell, value == null ? '—' : String(value));
        }
      }
      wrap.append(table);
      return wrap;
    }

    function renderAnswer(text) {
      answer.replaceChildren();
      const lines = text.trim().split(/\r?\n/).map((line) => line.trim());
      const cells = (line) => line.slice(1, -1).split('|').map((cell) => cell.trim());
      const tableRow = (line) => line?.startsWith('|') && line.endsWith('|');
      for (let index = 0; index < lines.length; index += 1) {
        const line = lines[index];
        if (!line) continue;
        if (tableRow(line) && tableRow(lines[index + 1]) && cells(lines[index + 1]).every((cell) => /^:?-{2,}:?$/.test(cell))) {
          const headings = cells(line);
          const rows = [];
          index += 1;
          while (tableRow(lines[index + 1])) rows.push(cells(lines[++index]));
          answer.append(tableNode(headings, rows));
          continue;
        }
        if (/^[-*] /.test(line)) {
          const list = element('ul');
          do {
            const item = element('li');
            inlineText(item, lines[index].slice(2));
            list.append(item);
            index += 1;
          } while (/^[-*] /.test(lines[index] || ''));
          index -= 1;
          answer.append(list);
          continue;
        }
        const heading = /^#{1,6}\s+/.test(line);
        const paragraph = element(heading ? 'h3' : 'p');
        inlineText(paragraph, heading ? line.replace(/^#{1,6}\s+/, '') : line);
        answer.append(paragraph);
      }
    }

    function setStage(id, state, note) {
      const stage = find('#stage-' + id);
      stage.dataset.state = state;
      stage.querySelector('.stage-state').textContent = stageLabels[state];
      stage.querySelector('.stage-note').textContent = note;
    }

    function setBadge(label, tone = '') {
      badge.textContent = label;
      badge.dataset.tone = tone;
    }

    function showQuery(question) {
      resultQuestion.textContent = question;
      resultQuestion.hidden = !question;
    }

    function showSql(trace) {
      sqlOutput.replaceChildren();
      if (!trace.length) {
        const empty = element('p', '표시할 조회 기록이 없습니다.');
        empty.className = 'empty';
        sqlOutput.append(empty);
      }
      for (const [index, record] of trace.entries()) {
        const card = element('div');
        card.className = 'trace-query';
        let args = null;
        try { args = JSON.parse(record.arguments); } catch { /* 원문 호출 인수를 표시합니다. */ }
        const data = record.result?.data;
        const heading = data ? `조회 ${index + 1} · ${data.returned_count}행` : `조회 ${index + 1}`;
        card.append(element('h3', heading), element('pre', args?.sql ?? record.arguments ?? 'SQL 없음'));
        if (args?.parameters?.length) card.append(element('p', `바인딩 값 ${JSON.stringify(args.parameters)}`));
        if (record.result?.error) card.append(element('p', record.result.error));
        if (data?.truncated) card.append(element('p', '반환 제한에 따라 일부 결과만 표시됩니다.'));
        if (data?.columns?.length && data.rows?.length) {
          card.append(tableNode(data.columns, data.rows.map((row) => data.columns.map((key) => row[key]))));
        }
        sqlOutput.append(card);
      }
    }

    function renderResult(question, result, sample = false) {
      showQuery(question);
      const trace = result.tool_trace ?? [];
      const intent = result.intent;
      const stageError = result.error?.stage;
      const status = result.status;
      const providerStage = { intent_analysis: 'Gemini 의도 분석', retrieval: 'SQLite 조회', final_answer: 'OpenAI 답변 생성' };
      const error = result.error;
      const diagnostic = error && (error.detail || (error.http_status && `HTTP ${error.http_status}`));
      const label = sample ? '저장된 예제' : ({ success: '답변 완료', needs_clarification: '확인 필요', unsupported: '지원되지 않는 질문' }[status] ?? '처리 실패');
      const tone = sample ? '' : (status === 'success' ? 'success' : (error ? 'error' : 'warning'));
      setBadge(label, tone);
      renderAnswer(result.answer || `${providerStage[stageError] ?? '질문 처리'}에 실패했습니다.${diagnostic ? ` (${diagnostic})` : ''}`);
      reference.hidden = !intent?.reference_date;
      reference.textContent = intent?.reference_date ? `기준일 ${intent.reference_date}` : '';
      setStage('intent', stageError === 'intent_analysis' ? 'failed' : (intent ? 'done' : 'idle'), '질문 의도 분석');
      setStage('sql', stageError === 'retrieval' ? 'failed' : (trace.length ? 'done' : 'skipped'), trace.length ? `SQL ${trace.length}건 실행` : '실행한 SQL 없음');
      setStage('answer', stageError === 'final_answer' ? 'failed' : (result.openai_called ? 'done' : 'skipped'), '조회 결과로 답변 작성');
      showSql(trace);
    }

    for (const preset of document.querySelectorAll('.preset')) {
      preset.addEventListener('click', () => {
        input.value = preset.dataset.question;
        input.focus();
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question || submit.disabled) return;
      submitted = true;
      submit.disabled = true;
      find('#loader').hidden = false;
      find('#submit-label').textContent = '처리 중';
      setBadge('처리 중');
      showQuery(question);
      renderAnswer('질문을 분석하고 있습니다.');
      reference.hidden = true;
      setStage('intent', 'pending', '질문 의도 분석');
      setStage('sql', 'idle', 'Gemini SQL로 조회');
      setStage('answer', 'idle', '조회 결과로 답변 작성');
      sqlDetails.open = false;
      showSql([]);
      try {
        const response = await fetch('/api/query', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || '웹 요청이 실패했습니다.');
        renderResult(question, data);
      } catch (error) {
        setBadge('연결 오류', 'error');
        setStage('intent', 'idle', '질문 의도 분석');
        renderAnswer(error instanceof TypeError || error instanceof SyntaxError ? '웹 콘솔 서버가 실행 중인지 확인해 주세요.' : error.message);
      } finally {
        submit.disabled = false;
        find('#loader').hidden = true;
        find('#submit-label').textContent = '질문하기';
      }
    });

    fetch('/api/example')
      .then((response) => response.ok ? response.json() : null)
      .then((example) => { if (example && !submitted) renderResult(example.question, example.result, true); })
      .catch(() => {});
  </script>
</body>
</html>
